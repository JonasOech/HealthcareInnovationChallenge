<!doctype html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Equipment Log</title>
<meta name="description" content="Quick Equipment Log: voice-first equipment tracking for Tallaght University Hospital OT. Healthcare Innovation Challenge 2026.">
<link rel="icon" href="hospital_logo.png">
<link rel="stylesheet" href="deck.css">
<style>
  @font-face { font-family: Jakarta; font-weight: 600; src: url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2); }
  @font-face { font-family: Jakarta; font-weight: 700; src: url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2); }
  @font-face { font-family: Jakarta; font-weight: 800; src: url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }

  @font-face { font-family: Playfair; font-weight: 400; src: url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-normal.woff2); }
  @font-face { font-family: DMSans; font-weight: 400; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2); }
  @font-face { font-family: DMSans; font-weight: 500; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2); }

  :root {
    --primary: #00685F; --primary-c: #008378; --mint: #6DF5E1; --mint-dim: #4FDBC8;
    --surface: #FAF8FF; --container: #EAEDFF; --on-surface: #131B2E; --on-var: #3D4947;
    --ai: #4648D4; --ai-bg: #EEF2FF; --ai-text: #3730A3; --red: #EF4444; --crit-bg: #FEF2F2;
    --warn-bg: #FEF3C7; --warn-text: #92400E; --inverse: #283044;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--surface); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  #bg-light { background: radial-gradient(1200px 800px at 70% 30%, #ffffff 0%, var(--surface) 55%, #EEF0FF 100%); }
  #bg-dark { background: radial-gradient(1400px 1000px at 30% 20%, #00897D 0%, #00685F 38%, #003D38 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; }
  #grid { background-image: radial-gradient(rgba(0,104,95,.16) 1.6px, transparent 1.6px); background-size: 34px 34px;
          mask-image: radial-gradient(900px 700px at 50% 50%, #000 0%, transparent 75%); -webkit-mask-image: radial-gradient(900px 700px at 50% 50%, #000 0%, transparent 75%); }
  #glow { width: 900px; height: 900px; border-radius: 50%; position: absolute; filter: blur(60px); }
  canvas#gl { position: absolute; inset: 0; }

  .text { position: absolute; top: 0; bottom: 0; width: 820px; display: flex; flex-direction: column; justify-content: center; }
  .text.left { left: 150px; } .text.right { right: 130px; } .text.center { left: 0; right: 0; width: auto; align-items: center; text-align: center; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; font: 700 22px/1 Inter; letter-spacing: .14em; text-transform: uppercase;
            color: var(--primary); background: rgba(109,245,225,.45); padding: 12px 20px; border-radius: 999px; margin-bottom: 28px; }
  .text.center .kicker { align-self: center; }
  .kicker .num { background: var(--primary); color: #fff; border-radius: 999px; padding: 5px 10px; letter-spacing: .04em; }
  .title { font: 800 92px/1.02 Jakarta; letter-spacing: -0.035em; color: var(--on-surface); }
  .text.tight { width: 900px; }             /* long one-liners (scene 4) that must not wrap */
  .text.tight .title { font-size: 62px; }
  .text.tight .sub { max-width: 840px; }
  .title .ln { display: block; overflow: hidden; padding-bottom: 8px; }
  .title .ln > span { display: inline-block; will-change: transform; }
  .sub { font: 400 34px/1.42 Inter; color: var(--on-var); margin-top: 26px; max-width: 760px; }
  .text.center .sub { max-width: 1100px; }
  mark { position: relative; background: none; color: inherit; white-space: nowrap; }
  mark::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: 6%; height: 42%; border-radius: 8px;
                 background: var(--hl, var(--mint)); transform-origin: left center; transform: scaleX(var(--p, 0)); z-index: -1; }
  mark.ai { --hl: rgba(96,99,238,.32); } mark.red { --hl: rgba(239,68,68,.28); } mark.warn { --hl: #FDE68A; }
  .title, .sub { position: relative; z-index: 0; isolation: isolate; }
  .chips { display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
  .chip { display: flex; align-items: center; gap: 18px; font: 600 30px/1.2 Inter; color: var(--on-surface); background: #fff;
          border: 1.5px solid #E2E7FF; border-radius: 18px; padding: 18px 26px; box-shadow: 0 10px 30px rgba(19,27,46,.07); align-self: flex-start; }
  .chip .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; flex: none; }
  .chip .ic svg { width: 26px; height: 26px; }
  .dark .title, .dark .chip { color: #fff; }
  .text.dark { width: 1040px; } .text.dark .title { font-size: 86px; } .dark .sub { color: rgba(255,255,255,.82); }
  .dark .kicker { color: var(--mint); background: rgba(109,245,225,.14); }
  .dark .kicker .num { background: var(--mint); color: #00201D; }
  .dark mark::before { background: var(--hl, rgba(109,245,225,.38)); }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; border-radius: 22px; background: #fff; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .foot { font: 500 24px/1.4 Inter; color: rgba(255,255,255,.7); margin-top: 34px; }
  .credit { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font: 400 17px/1 Inter; color: rgba(255,255,255,.55); }
  #wipe { position: absolute; inset: -10% -30%; background: linear-gradient(100deg, var(--primary) 0%, var(--primary-c) 60%, var(--mint-dim) 100%);
          transform: translateX(-140%) skewX(-12deg); }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--primary), var(--mint)); }

  /* how it works (how.js): HC21 labels, then capture → synchronize → visualization */
  .text.top { justify-content: flex-start; padding-top: 78px; width: 1150px; }
  .text.top .title { font-size: 64px; }
  .text.top .sub { font-size: 30px; margin-top: 14px; color: var(--primary); font-weight: 500; }
  .text.top .sub b { color: var(--mint-dim); margin: 0 6px; }
  .text.top.center { width: auto; }         /* synchronized access title, centred over the ring */
  .text.demo .title { font-size: 168px; }    /* tech demo section title */
  .how { position: absolute; inset: 0; display: none; pointer-events: none; }
  .how .ic svg { width: 100%; height: 100%; }
  #hc21 .eq-label { position: absolute; left: 150px; top: 420px; display: flex; align-items: center; gap: 10px;
                    font: 700 20px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: var(--on-var); }
  #hc21 .eq-label .ic { width: 24px; height: 24px; color: var(--primary); }
  #hc21 .eq-row { position: absolute; left: 150px; top: 462px; display: flex; gap: 26px; }
  #hc21 .eq { position: relative; width: 300px; height: 278px; background: #fff; border: 1.5px solid #E2E7FF; border-radius: 26px;
              box-shadow: 0 16px 40px rgba(19,27,46,.08); display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
  #hc21 .art { height: 118px; display: grid; place-items: center; color: var(--primary); }
  #hc21 .art svg { height: 112px; width: 150px; }
  #hc21 .ecg { stroke-dasharray: 70 34; }
  #hc21 .lbl { position: relative; margin-top: 12px; width: 246px; padding: 10px 14px 9px; border-radius: 12px; background: #fff;
               border: 2px dashed #C7CFE8; text-align: center; transition: none; }
  #hc21 .lbl.done { border: 2px solid var(--primary); box-shadow: 0 0 0 5px rgba(109,245,225,.35); }
  #hc21 .lbl .cap { font: 600 14px/1 Inter; color: var(--on-var); margin-bottom: 6px; text-align: left; }
  #hc21 .lbl .bars { width: 214px; height: 42px; fill: var(--on-surface); display: block; }
  #hc21 .lbl .id { font: 600 17px/1 Inter; letter-spacing: .12em; margin-top: 6px; color: var(--on-surface); font-variant-numeric: tabular-nums; }
  #hc21 .finder { position: absolute; inset: -8px; border-radius: 14px; opacity: 0;
                  background: linear-gradient(var(--red), var(--red)) 0 0/22px 4px, linear-gradient(var(--red), var(--red)) 0 0/4px 22px,
                              linear-gradient(var(--red), var(--red)) 100% 0/22px 4px, linear-gradient(var(--red), var(--red)) 100% 0/4px 22px,
                              linear-gradient(var(--red), var(--red)) 0 100%/22px 4px, linear-gradient(var(--red), var(--red)) 0 100%/4px 22px,
                              linear-gradient(var(--red), var(--red)) 100% 100%/22px 4px, linear-gradient(var(--red), var(--red)) 100% 100%/4px 22px;
                  background-repeat: no-repeat; }
  #hc21 .laser { position: absolute; left: -6px; right: -6px; height: 3px; background: var(--red); border-radius: 2px; opacity: 0;
                 box-shadow: 0 0 12px 3px rgba(239,68,68,.6); }
  #hc21 .ok { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff;
              padding: 9px; opacity: 0; box-shadow: 0 6px 16px rgba(0,104,95,.35); }
  #hc21 .link { position: absolute; left: 1100px; top: 583px; width: 260px; height: 40px; overflow: visible; }
  #hc21 .link path { fill: none; stroke: var(--primary); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  #hc21 .link .head { opacity: 0; }
  #hc21 .packet { position: absolute; left: 1114px; top: 548px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
                  background: var(--primary); color: #fff; font: 600 18px/1 Inter; letter-spacing: .06em; opacity: 0; transform-origin: right center;
                  box-shadow: 0 10px 24px rgba(0,104,95,.35); white-space: nowrap; }
  #hc21 .packet .ic { width: 20px; height: 20px; }
  #hc21 .steps { position: absolute; left: 150px; top: 778px; width: 952px; display: flex; align-items: stretch; gap: 14px; }
  #hc21 .step { flex: 1; display: flex; gap: 18px; background: #fff; border: 1.5px solid #E2E7FF; border-radius: 22px; padding: 22px 24px;
                box-shadow: 0 10px 30px rgba(19,27,46,.07); }
  #hc21 .step .n { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font: 800 24px/1 Jakarta; }
  #hc21 .step:last-child .n { background: var(--ai); }
  #hc21 .step .h { display: flex; align-items: center; gap: 10px; font: 800 25px/1.15 Jakarta; color: var(--on-surface); margin: 8px 0 10px; }
  #hc21 .step .h .ic { width: 28px; height: 28px; color: var(--primary); flex: none; }
  #hc21 .step:last-child .h .ic { color: var(--ai); }
  #hc21 .step p { font: 400 22px/1.4 Inter; color: var(--on-var); }
  #hc21 .chev { align-self: center; font: 800 40px/1 Jakarta; color: var(--mint-dim); }

  #flow .pipes { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #flow .pipes path { fill: none; stroke: rgba(70,72,212,.45); stroke-width: 14; stroke-linecap: round; }
  #flow .packets i { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 4px; background: #B9FFF4;
                     border: 2px solid #fff; box-shadow: 0 0 14px 4px rgba(109,245,225,.85); }
  #flow .pill { position: absolute; top: 74px; display: inline-flex; align-items: center; gap: 12px; font: 700 24px/1 Inter; letter-spacing: .1em;
                text-transform: uppercase; color: var(--primary); background: rgba(109,245,225,.45); padding: 13px 22px 13px 14px; border-radius: 999px; opacity: 0; }
  #flow .pill .num { background: var(--primary); color: #fff; border-radius: 999px; padding: 5px 11px; letter-spacing: 0; }
  #flow .p1 { left: 270px; } #flow .p2 { left: 810px; } #flow .p3 { left: 1440px; }
  #flow .hub { position: absolute; left: 910px; top: 776px; width: 140px; height: 140px; border-radius: 34px; padding: 34px; color: #fff;
               background: linear-gradient(140deg, var(--primary-c), var(--primary)); box-shadow: 0 20px 50px rgba(0,104,95,.4), inset 0 2px 0 rgba(255,255,255,.25); opacity: 0; }
  #flow .hub svg { width: 100%; height: 100%; position: relative; }
  #flow .hub .ring { position: absolute; inset: 0; border-radius: 34px; border: 3px solid var(--mint-dim); }
  #flow .beam { position: absolute; left: 860px; top: 600px; width: 240px; height: 196px; transform-origin: 50% 100%; opacity: 0;
                clip-path: polygon(0 0, 100% 0, 66% 100%, 34% 100%); background: linear-gradient(180deg, rgba(109,245,225,0) 0%, rgba(109,245,225,.65) 100%); }
  #flow .db { position: absolute; left: 850px; top: 236px; width: 260px; opacity: 0; transform-origin: 50% 100%; text-align: center; }
  #flow .db svg { width: 260px; height: 314px; display: block; filter: drop-shadow(0 26px 40px rgba(0,104,95,.3)); }
  #flow .db .cap { position: absolute; left: -60px; right: -60px; top: 324px; font: 800 24px/1.2 Jakarta; color: var(--primary); white-space: nowrap;
                   transform-origin: 50% 0; }
  #flow .db .cap span { display: inline-block; padding: 9px 22px; border-radius: 999px; background: rgba(255,255,255,calc(.94 * var(--pill, 0)));
                        box-shadow: 0 12px 30px rgba(0,104,95,calc(.18 * var(--pill, 0))); }
  #flow .links { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #flow .links path { fill: none; stroke: rgba(0,104,95,.38); stroke-width: 8; stroke-linecap: round; }
  #flow .lp i { width: 14px; height: 14px; }
  #flow .sheet { position: absolute; left: 770px; top: 236px; width: 420px; background: #fff; border-radius: 18px; overflow: hidden; opacity: 0;
                 border: 1.5px solid #D6DCF5; box-shadow: 0 30px 70px rgba(19,27,46,.18); }
  #flow .sheet .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #EEF7F5; font: 700 19px/1 Jakarta; color: var(--on-surface); }
  #flow .sheet .xl { width: 26px; height: 26px; border-radius: 6px; background: #1D7A45; color: #fff; display: grid; place-items: center; font: 800 15px/1 Inter; }
  #flow .sheet .row { display: grid; grid-template-columns: 128px 1fr 54px 92px; font: 500 15px/1 Inter; color: var(--on-surface);
                      border-top: 1px solid #E3E6EF; font-variant-numeric: tabular-nums; }
  #flow .sheet .row span { padding: 13px 0 13px 12px; white-space: nowrap; overflow: hidden; }
  #flow .sheet .row span + span { border-left: 1px solid #E3E6EF; }
  #flow .sheet .row.head { font-weight: 700; color: var(--on-var); background: #F4F5FA; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  #flow .sheet .row.loan span:last-child { background: #FEF3C7; color: #92400E; }
  #flow .sheet .row.ok span:last-child { background: #DCFCE7; color: #166534; }
  #flow .sheet .row.rep { background: #FEE2E2; color: #991B1B; }
  #flow .xl-note { position: absolute; left: 836px; top: 186px; display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 12px; border-radius: 999px;
                   background: #1D7A45; color: #fff; font: 800 22px/1 Jakarta; white-space: nowrap; box-shadow: 0 16px 36px rgba(29,122,69,.4); opacity: 0; }
  #flow .xl-note .xl { width: 32px; height: 32px; border-radius: 8px; background: #fff; color: #1D7A45; display: grid; place-items: center; font: 800 18px/1 Inter; }
  #flow .dash { position: absolute; left: 1300px; top: 160px; width: 560px; height: 760px; background: #fff; border-radius: 26px; overflow: hidden; opacity: 0;
                border: 1.5px solid #D6DCF5; box-shadow: 0 30px 80px rgba(19,27,46,.2); display: flex; flex-direction: column; transform-origin: 0 60%; }
  #flow .dash-note { position: absolute; left: 1300px; top: 946px; width: 560px; text-align: center; font: 500 20px/1 Inter; letter-spacing: .06em;
                    color: #8A919E; opacity: 0; }
  #flow .dash .top { background: linear-gradient(100deg, var(--primary), var(--primary-c)); color: #fff; font: 800 23px/1.2 Jakarta; padding: 20px 24px; }
  #flow .tiles { display: flex; gap: 12px; padding: 16px 16px 0; }
  #flow .tile { flex: 1; background: var(--surface); border: 1.5px solid #E2E7FF; border-radius: 16px; padding: 14px; }
  #flow .tile span { display: block; font: 600 14px/1.2 Inter; color: var(--on-var); }
  #flow .tile b { display: block; font: 800 40px/1 Jakarta; color: var(--on-surface); margin-top: 10px; font-variant-numeric: tabular-nums; }
  #flow .tile:nth-child(3) b { color: var(--primary); }
  #flow .mid { display: flex; gap: 12px; padding: 12px 16px 0; }
  #flow .panel { background: var(--surface); border: 1.5px solid #E2E7FF; border-radius: 16px; padding: 14px; flex: 1; }
  #flow .panel h4 { font: 700 16px/1 Jakarta; color: var(--on-surface); margin-bottom: 8px; }
  #flow .pie { display: flex; align-items: center; gap: 8px; }
  #flow .pie svg { width: 130px; height: 130px; transform: rotate(-90deg); flex: none; }
  #flow .pie circle { fill: none; stroke-width: 26; }
  #flow .pie ul { list-style: none; font: 500 13px/1.2 Inter; color: var(--on-var); display: flex; flex-direction: column; gap: 7px; }
  #flow .pie li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #flow .pie li i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #flow .line { width: 100%; height: 150px; display: block; overflow: visible; }
  #flow .line .stroke { fill: none; stroke: var(--ai); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  #flow .line .area { fill: rgba(96,99,238,.14); opacity: 0; }
  #flow .line circle { fill: #fff; stroke: var(--ai); stroke-width: 3; opacity: 0; }
  #flow .line text { font: 500 12px Inter; fill: var(--on-var); text-anchor: middle; }
  #flow .status { margin: 12px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  #flow .bars { flex: 1; display: flex; gap: 22px; align-items: stretch; padding: 4px 18px 0; }
  #flow .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #flow .bars .col { flex: 1; width: 100%; display: flex; align-items: flex-end; border-bottom: 2px solid #D6DCF5; }
  #flow .bars i { display: block; width: 100%; height: 100%; border-radius: 10px 10px 0 0; transform-origin: 50% 100%; transform: scaleY(0); }
  #flow .bars span { font: 600 14px/1 Inter; color: var(--on-var); }

  /* business case (money.js): staff time and money saved cards, then the payback chart */
  #money .card { position: absolute; top: 268px; height: 720px; background: #fff; border: 1.5px solid #E2E7FF; border-radius: 30px;
                 padding: 32px 36px; box-shadow: 0 24px 60px rgba(19,27,46,.1); display: flex; flex-direction: column; }
  #money h3 { font: 800 30px/1 Jakarta; letter-spacing: .04em; text-transform: uppercase; color: var(--ai); }
  #money .staff { left: 140px; width: 800px; } #money .money { left: 980px; width: 800px; }
  #money .foot { font: 500 34px/1.3 Inter; color: var(--on-surface); margin-top: auto; }
  #money .foot b { font-weight: 800; font-family: Jakarta; }
  #money .foot span { font-weight: 700; color: var(--primary); white-space: nowrap; }
  #money .circles { width: 100%; display: block; margin-top: 12px; overflow: visible; }
  #money .circles text { text-anchor: middle; dominant-baseline: central; }
  #money .circles .n { font: 800 92px Jakarta; letter-spacing: -0.03em; fill: var(--on-surface); }
  #money .small .n { font-size: 34px; letter-spacing: 0; fill: #fff; }
  #money .circles .cap { font: 600 26px Inter; fill: var(--on-var); opacity: 0; }
  #money .big circle { fill: #E4E5FF; } #money .small circle { fill: var(--primary); }
  #money .big, #money .small { transform-box: fill-box; transform-origin: center; opacity: 0; }
  #money .ring circle { fill: none; stroke-width: 14; stroke-dasharray: 0 2000; }
  #money .arrow path { fill: none; stroke: var(--mint-dim); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  #money .arrow .head { opacity: 0; }
  #money .legend { list-style: none; display: grid; grid-template-columns: auto auto; justify-content: start; gap: 14px 48px; font: 500 22px/1 Inter;
                   color: var(--on-var); margin-top: 22px; }
  #money .legend li { display: flex; align-items: center; gap: 9px; opacity: 0; }
  #money .legend i { width: 16px; height: 16px; border-radius: 4px; }
  #money .legend b { font-weight: 700; color: var(--on-surface); }
  #money .bars { display: flex; gap: 48px; padding: 0 30px; margin-top: 20px; }
  #money .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #money .bars .v { font: 800 44px/1 Jakarta; letter-spacing: -0.02em; color: var(--on-surface); font-variant-numeric: tabular-nums; opacity: 0;
                    margin-bottom: 16px; white-space: nowrap; }
  #money .bars .col { height: 364px; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-bottom: 2px solid #D6DCF5; }
  #money .bars i { display: block; width: 100%; border-radius: 12px 12px 0 0; background: #4FB3BF; transform-origin: 50% 100%; transform: scaleY(0); }
  #money .bars .total i { background: var(--primary); }
  #money .bars .total .v { color: var(--primary); }
  #money .bars span { font: 600 24px/1.25 Inter; color: var(--on-var); text-align: center; opacity: 0; }
